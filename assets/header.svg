<svg xmlns="http://www.w3.org/2000/svg" width="820" height="170" viewBox="0 0 820 170" role="img" aria-labelledby="t d">
<title id="t">Hi there, I'm Sabbir Hossain</title>
<desc id="d">Animated greeting with a waving hand. Below the name, a line types out in turn: Software QA Engineer, Playwright automation, AI-powered testing, Remote QA for teams worldwide.</desc>
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#16a34a"/>
    <stop offset="1" stop-color="#0284c7"/>
  </linearGradient>
</defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;text-anchor:middle}
.hi{font-size:24px;font-weight:500;fill:#768390}
.name{font-size:54px;font-weight:800;fill:url(#g);letter-spacing:.5px}
.role{transform-box:fill-box;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:20px;fill:#768390}
.in{opacity:0;animation:up .7s ease-out forwards}
.d1{animation-delay:.1s}.d2{animation-delay:.45s}
.hand{display:inline-block;transform-box:fill-box;transform-origin:70% 80%;animation:wave 2.4s ease-in-out .8s 3}
.r{opacity:0;animation:role 12s ease-in-out infinite}
.r1{animation-delay:1.1s}.r2{animation-delay:4.1s}.r3{animation-delay:7.1s}.r4{animation-delay:10.1s}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%{transform:rotate(-8deg)}40%{transform:rotate(-4deg)}50%{transform:rotate(10deg)}}
@keyframes role{0%{opacity:0;transform:translateY(8px)}5%,21%{opacity:1;transform:none}25%,100%{opacity:0;transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){.in{animation:none;opacity:1}.hand{animation:none}.r{animation:none}.r1{opacity:1}}
</style>
<g class="in d1">
  <text x="396" y="40" class="hi">Hi there, I'm</text>
  <text x="490" y="41" class="hi hand">👋</text>
</g>
<text x="410" y="102" class="name in d2">Sabbir Hossain</text>
<text x="410" y="146" class="role r r1">Software QA Engineer</text>
<text x="410" y="146" class="role r r2">Playwright automation</text>
<text x="410" y="146" class="role r r3">AI-powered testing</text>
<text x="410" y="146" class="role r r4">Remote QA for teams worldwide</text>
</svg>
