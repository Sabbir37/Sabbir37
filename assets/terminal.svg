<svg xmlns="http://www.w3.org/2000/svg" width="820" height="350" viewBox="0 0 820 350" role="img" aria-labelledby="t d">
<title id="t">Sabbir Hossain, Software QA Engineer</title>
<desc id="d">A terminal runs a Playwright test command and lists the quality checks Sabbir runs before a release; all 6 pass.</desc>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:15px;fill:#e6edf3}
.mute{fill:#8b949e} .ok{fill:#3fb950} .acc{fill:#58a6ff} .flag{fill:#d2a8ff} .b{font-weight:700}
.l{opacity:0;animation:in .35s ease-out forwards}
.type{clip-path:inset(0 100% 0 0);animation:type 1.6s steps(37) 0.4s forwards}
.cur{fill:#e6edf3;opacity:0;animation:blink 1.1s step-end infinite}
@keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes type{to{clip-path:inset(0 0 0 0)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.l,.type{animation:none;opacity:1;clip-path:none}.cur{animation:none;opacity:1}}
</style>
<rect x="1" y="1" width="818" height="348" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
<path d="M1 13a12 12 0 0 1 12-12h794a12 12 0 0 1 12 12v23H1z" fill="#161b22"/>
<line x1="1" y1="36" x2="819" y2="36" stroke="#30363d"/>
<circle cx="24" cy="19" r="6" fill="#ff5f57"/><circle cx="44" cy="19" r="6" fill="#febc2e"/><circle cx="64" cy="19" r="6" fill="#28c840"/>
<text x="410" y="24" text-anchor="middle" class="mute" style="font-size:13px">sabbir@qa — remote</text>
<text x="28" y="70"><tspan class="ok b">➜</tspan><tspan class="acc"> ~</tspan></text>
<text x="64" y="70" class="type">npx playwright test <tspan class="flag">--project=release</tspan></text>
<text x="28" y="98" class="l mute" style="animation-delay:2.30s">Running 6 checks before release</text>
<g class="l" style="animation-delay:2.80s"><text x="40" y="132" class="ok">✓</text><text x="66" y="132">happy paths work end to end</text></g>
<g class="l" style="animation-delay:3.25s"><text x="40" y="160" class="ok">✓</text><text x="66" y="160">edge cases and bad input handled</text></g>
<g class="l" style="animation-delay:3.70s"><text x="40" y="188" class="ok">✓</text><text x="66" y="188">permissions: only the right users can change data</text></g>
<g class="l" style="animation-delay:4.15s"><text x="40" y="216" class="ok">✓</text><text x="66" y="216">API responses validated</text></g>
<g class="l" style="animation-delay:4.60s"><text x="40" y="244" class="ok">✓</text><text x="66" y="244">works on web, Android and iOS</text></g>
<g class="l" style="animation-delay:5.05s"><text x="40" y="272" class="ok">✓</text><text x="66" y="272">every bug filed with steps, screenshots and video</text></g>
<g class="l" style="animation-delay:5.80s"><text x="28" y="316"><tspan class="ok b">6 passed</tspan><tspan class="mute">  ·  </tspan><tspan class="acc b">ready to ship</tspan></text><rect class="cur" x="268" y="302" width="9" height="18" style="animation-delay:6.20s"/></g>
</svg>
